# MatchMind Live — full local stack (synthetic-first)
# Requires Docker Desktop. The event engine serves the synthetic,
# football-realistic replay used for the hackathon submission.
services:
  engine:
    build:
      context: ./matchmind
      dockerfile: Dockerfile.engine
    environment:
      PORT: "5000"
      # Optional: point Ask MatchMind at GitHub Models / Azure OpenAI
      # OPENAI_BASE_URL: https://models.github.ai/inference
      # OPENAI_MODEL: openai/gpt-4o-mini
      # OPENAI_API_KEY: <your token>
    ports:
      - "5000:5000"

  studio:
    build:
      context: ./matchmind
      dockerfile: Dockerfile.studio
    environment:
      PORT: "5173"
      BASE_PATH: "/"
      API_PROXY_TARGET: http://engine:5000
    ports:
      - "5173:5173"
    depends_on:
      - engine

  intel:
    image: node:24-alpine
    working_dir: /app
    command: sh -c "corepack enable && npm install && npm run dev"
    environment:
      PORT: "3005"
    ports:
      - "3005:3005"
    volumes:
      - ./football-intel:/app
